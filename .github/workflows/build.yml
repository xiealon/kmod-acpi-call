name: build kmod-acpi-call

# 用 ImmortalWrt 25.12.2 官方 SDK 编译 kmod-acpi-call，
# 同时编一个 10 行的 tiny 模块做对照，判断 insmod 的
# "Invalid relocation target" 是环境问题还是 acpi_call.c 自身问题。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-kmod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev rsync gawk gettext unzip file wget python3 bc libelf-dev

      - name: 下载并解压 SDK 25.12.2
        run: |
          set -eu
          F=immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/${F}"
          wget -q --timeout=60 --tries=3 "$URL" -O /tmp/sdk.tar.zst
          ls -l /tmp/sdk.tar.zst
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(ls -d /opt/sdk/*/ | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "解压到 $SDK_DIR"

      - name: 注入包并编译
        run: |
          set -u
          cd "$SDK_DIR"
          mkdir -p package/kernel
          cp -rv "$GITHUB_WORKSPACE/package/kernel/acpi-call" package/kernel/
          cp -rv "$GITHUB_WORKSPACE/package/kernel/tiny" package/kernel/
          make defconfig
          echo "=== 编译 tiny（对照）"
          make package/kernel/tiny/compile V=s -j"$(nproc)" 2>&1 | tail -40
          echo "=== 编译 acpi-call"
          make package/kernel/acpi-call/compile V=s -j"$(nproc)" 2>&1 | tail -60

      - name: 收集产物
        run: |
          set -u
          cd "$SDK_DIR"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for n in acpi_call tiny; do
            find . -name "$n.ko" 2>/dev/null | while IFS= read -r f; do
              echo "$n.ko: $f ($(stat -c%s "$f") B)"
              cp -v "$f" "$GITHUB_WORKSPACE/out"/ || true
            done
          done
          find . -name '*acpi-call*.apk' -o -name '*tiny*.apk' 2>/dev/null | while IFS= read -r f; do
            cp -v "$f" "$GITHUB_WORKSPACE/out"/ || true
          done
          echo "=== 产物清单"
          ls -l "$GITHUB_WORKSPACE/out" || true
          echo "=== vermagic 对照"
          for k in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -e "$k" ] || continue
            echo "--- $(basename "$k")"
            modinfo "$k" | grep -E 'vermagic|depends|name' || true
          done
          echo "=== 段表对照"
          for k in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -e "$k" ] || continue
            echo "--- $(basename "$k")"
            readelf -S "$k" | grep -E 'mcount|BTF|debug_info|note.gnu|\.text ' || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmod-output
          path: ${{ github.workspace }}/out/*
          if-no-files-found: warn
