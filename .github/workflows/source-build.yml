name: build kmod-acpi-call (source tree)

# 不再用 SDK。改用 immortalwrt-src @ v25.12.2 完整源码树：
#   SDK 里的内核树缺 Kconfig、且 config 与真机不同（FUNCTION_TRACER 未开），
#   用它编出的模块在真机上 insmod 报 Invalid relocation target。
#
# 这里把内核 .config 换成真机 /proc/config.gz（kernel-real.config），
# 用 olddefconfig + modules_prepare 生成匹配的 autoconf.h，再手工 kbuild。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package/kernel/acpi-call/**'
      - 'kernel-real.config'
      - '.github/workflows/source-build.yml'

permissions:
  contents: write

concurrency:
  group: src-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev rsync gawk gettext unzip file wget \
            bc libelf-dev libssl-dev flex bison python3 zstd git

      - name: 拉取源码树 v25.12.2
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/xiealon/immortalwrt-src.git src
          cd src
          git log --oneline -1
          ls | head -20

      - name: 生成 .config
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/src"
          cp -v "$GITHUB_WORKSPACE/config.buildinfo" .config
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf 2>/dev/null || true
          make defconfig 2>&1 | tail -10
          grep -E 'CONFIG_TARGET_x86|CONFIG_TARGET_SUBTARGET' .config

      - name: 准备内核源码
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/src"
          make target/linux/prepare V=s -j"$(nproc)" 2>&1 | tail -40
          LINUX=$(ls -d build_dir/target-*/linux-*/linux-*/ 2>/dev/null | head -n1)
          if [ -z "$LINUX" ]; then
            echo "::error::没有拿到内核源码"
            find build_dir -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "LINUX=$(pwd)/${LINUX%/}" >> "$GITHUB_ENV"
          echo "内核源码: $(pwd)/${LINUX%/}"
          echo "=== Kconfig 检查（SDK 就是缺这个）"
          ls -l "$LINUX/Kconfig" || echo "缺 Kconfig"
          find "$LINUX" -maxdepth 1 -name 'Kconfig*' | head
          echo "=== 源码内部 Kconfig 数量"
          find "$LINUX" -name 'Kconfig*' | wc -l

      - name: 生成内核配置
        run: |
          set -u
          SRC="$GITHUB_WORKSPACE/src"
          cd "$LINUX"
          echo "=== 基底 x86_64_defconfig（它的 struct module = 1216，与真机一致）"
          make ARCH=x86_64 defconfig 2>&1 | tail -3
          echo "=== olddefconfig 补齐"
          make ARCH=x86_64 olddefconfig 2>&1 | tail -10
          echo "=== modules_prepare"
          make ARCH=x86_64 modules_prepare -j"$(nproc)" 2>&1 | tail -15
          echo "=== 项数: $(grep -cE '^CONFIG_[A-Za-z0-9_]+=' .config)"
          echo "=== autoconf 关键项"
          for k in CONFIG_MITIGATION_RETHUNK CONFIG_MITIGATION_SLS CONFIG_X86_KERNEL_IBT \
                   CONFIG_JUMP_LABEL CONFIG_FUNCTION_TRACER CONFIG_FTRACE_MCOUNT_RECORD \
                   CONFIG_FTRACE_MCOUNT_USE_PATCHABLE_FUNCTION_ENTRY \
                   CONFIG_UNWINDER_ORC CONFIG_UNWINDER_FRAME_POINTER \
                   CONFIG_TRACEPOINTS CONFIG_EVENT_TRACING CONFIG_KALLSYMS_ALL \
                   CONFIG_LIVEPATCH CONFIG_MODULE_SIG CONFIG_MODULE_UNLOAD \
                   CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES CONFIG_MODVERSIONS; do
            printf '  %-46s ' "$k"
            grep -h "^#define $k " include/generated/autoconf.h 2>/dev/null || echo "(未定义)"
          done
          echo "=== utsrelease"
          cat include/generated/utsrelease.h 2>/dev/null || true

      - name: 手工 kbuild 编模块
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/package/kernel/acpi-call/src"
          echo "=== 源码"
          ls -l
          # modules_prepare 不产生 Module.symvers；本内核 CONFIG_MODVERSIONS 关闭，
          # 模块加载时按符号名解析，因此放行 modpost 的未定义符号检查。
          make -C "$LINUX" M="$PWD" ARCH=x86_64 KBUILD_MODPOST_WARN=1 V=s modules 2>&1 | tail -60
          echo "=== 结果"
          ls -l *.ko 2>/dev/null || echo "没有生成 ko"
          for k in *.ko; do
            [ -e "$k" ] || continue
            echo "--- 原始 $(basename "$k") $(stat -c%s "$k") B"
            strip --strip-debug -o "${k%.ko}.stripped.ko" "$k" && echo "  已 strip-debug -> $(basename "${k%.ko}").stripped.ko $(stat -c%s "${k%.ko}.stripped.ko") B"
            modinfo "$k" | grep -E 'vermagic|depends|name|srcversion' || true
          done

      - name: 收集产物
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/package/kernel/acpi-call/src"
          cp -v *.ko "$GITHUB_WORKSPACE/out"/ 2>/dev/null || true
          echo "=== 产物清单"
          ls -l "$GITHUB_WORKSPACE/out"
          echo "=== 段表（应与真机模块一致：无 debug_info，有 __mcount_loc）"
          for k in "$GITHUB_WORKSPACE"/out/*.ko; do
            [ -e "$k" ] || continue
            echo "--- $(basename "$k") $(stat -c%s "$k") B"
            readelf -S "$k" | grep -E 'mcount|BTF|debug_info|note.gnu' || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmod-srcbuilt
          path: ${{ github.workspace }}/out/*
          if-no-files-found: warn
